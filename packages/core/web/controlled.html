<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="session-token" content="__TOKEN__"><title>受控任务 · 销售拨号助手</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>销售拨号助手 · 受控任务</strong><a href="/">返回工作台</a></header><main>
<section class="intro"><div><p class="eyebrow">任务跟进</p><h1>查清结果，再结束占用。</h1><p>回执刷新只查询已有记录。结果未知的任务会继续保留，直到明确核对。</p></div><span class="badge">本页不发起电话</span></section>
<p id="mode" class="notice">正在读取配置</p><p id="connection" class="notice"></p><button id="inspect" hidden>检查设备绑定（不拨号）</button><p id="message" role="status" aria-live="polite">正在加载</p>
<section class="card"><h2>本轮绑定与额度</h2><p id="binding"></p><p id="quota"></p><p id="deadline"></p><button id="reload">刷新任务列表</button><button id="send" disabled>真实拨号未开放</button></section>
<section class="card"><h2>任务与结果</h2><label for="attempts">选择已有尝试</label><select id="attempts"></select><p id="task"></p><p id="state"></p><p id="api-result"></p><p id="receipt-observation"></p><p id="phone-result"></p><p id="manual-result"></p><p id="pending" class="notice"></p><button id="receipt">查询已有回执</button></section>
<section class="card"><h2>显式核对</h2><p>先核对本次尝试没有活动通话，再保存人工结果。核对不退还已用次数。</p><label for="result">人工核对结果</label><select id="result"><option value="UNKNOWN">仍不确定</option><option value="NO_ANSWER">无人接听</option><option value="BUSY">忙线</option><option value="REJECTED">拒接</option><option value="COMPLETED">已完成</option><option value="FAILED">失败</option></select><label class="checkbox"><input id="confirmed" type="checkbox">我已核对本次尝试没有活动通话</label><button id="reconcile" disabled>核对并结束占用</button><p class="hint">手机核对未确认时，任务会保留待核对。接口返回、实际呼出、接通与人工结果分别显示。</p></section>
</main><script type="module" src="/controlled.mjs"></script></body></html>
