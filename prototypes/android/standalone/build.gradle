plugins { id 'com.android.application' }
android {
    namespace 'com.mantou.salesdialer.standalone'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mantou.salesdialer.standalone'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '0.2-simulation-batch'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy exactly the existing pure executor into a generated source directory.
// Adding the spike source root causes Android lint to scan unrelated phone components.
def sharedExecutorDir = layout.buildDirectory.dir('generated/shared-executor')
tasks.register('prepareSharedExecutor', Sync) {
    from('../app/src/main/java') { include 'com/mantou/salesdialer/spike/ControlledCallExecutor.java' }
    into(sharedExecutorDir)
}
android.sourceSets.main.java.srcDir(sharedExecutorDir)
tasks.named('preBuild').configure { dependsOn('prepareSharedExecutor') }
